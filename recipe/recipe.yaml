schema_version: 1

context:
  name: azure-ai-projects
  version: "2.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ba3c6626bfa710031de37f927ae488ca9614168382407d7b2bb8d6e20fe32ff8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - azure-core >=1.37.0
    - typing_extensions >=4.11
    - azure-identity >=1.15.0
    - openai >=3.0.0
    - azure-storage-blob >=12.15.0

tests:
  - python:
      imports:
        - azure.ai.projects
        - azure.ai.projects.aio
        - azure.ai.projects.models
        - azure.ai.projects.operations
        - azure.ai.projects.telemetry
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure AI Projects Client Library for Python
  description: |
    The AI Projects client library is part of the Microsoft Foundry SDK, and
    provides easy access to resources in your Microsoft Foundry Project. Use it
    to create and run Agents, enhance Agents with specialized tools, get an
    OpenAI client to run Responses and Conversations operations, and manage
    Datasets, Indexes, Deployments and Connections.
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/ai/azure-ai-projects
  repository: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/ai/azure-ai-projects
  documentation: https://learn.microsoft.com/python/api/overview/azure/ai-projects-readme

extra:
  recipe-maintainers:
    - xylar
